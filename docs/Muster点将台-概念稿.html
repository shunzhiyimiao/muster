  .tstep .body{padding-bottom:12px}
  .tstep .d{font-size:10px;color:var(--faint);margin-top:2px}

  .fab{position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(201,165,72,.45);z-index:40;color:#fff}
  .drawer{position:fixed;bottom:96px;right:24px;width:320px;z-index:40;overflow:hidden}
  .dhead{padding:12px 16px;display:flex;align-items:center;gap:10px;background:var(--goldSoft)}
  .bub{display:flex;gap:8px;margin-bottom:8px;font-size:12px}

  .codechip{font-size:12px;padding:4px 8px;border-radius:8px;background:var(--redSoft);color:var(--red)}
  .stamp{color:#fff;font-size:11px;font-weight:700}

  .mark{position:fixed;left:16px;bottom:14px;font-size:10px;color:var(--faint);z-index:30}
  .fade{animation:fadeUp .3s ease-out both}

  @media (prefers-reduced-motion:reduce){.wvbar,.fade{animation:none!important}}

const tstep = (t,d,tone,first,last) => `
  <div class="tstep">
    <div class="rail">
      ${first?'':'<span class="vln" style="height:8px"></span>'}
      <span class="dot" style="background:${tone==='gold'?'var(--gold)':tone==='green'?'var(--green)':'var(--faint)'}"></span>
      ${last?'':'<span class="vln" style="flex:1"></span>'}
    </div>
    <div class="body">
      <div style="font-weight:500;color:${tone==='gold'?'var(--goldDeep)':tone==='green'?'var(--green)':'var(--ink)'}">${t}</div>
      <div class="d num">${d}</div>
    </div>
  </div>`;

/* ================= 悬浮层 ================= */
function layerHTML(){
  let h = `<button class="fab" data-a="fab">${I('bot',24)}</button>`;
  if (S.fab) h += `
    <div class="card drawer fade">
      <div class="dhead">
        <div style="width:32px;height:32px;border-radius:50%;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center">${I('bot',16)}</div>
        <b style="font-size:14px">Agent-007</b>${pill('gold','编制 A-007')}<span class="ml">${routeTag(true)}</span>
      </div>
      <div style="padding:12px;max-height:220px;overflow-y:auto">
        <div class="bub"><div class="bav">${I('bot',12)}</div><div class="bt">我在。周会纪要已发布到 #platform,回滚脚本草稿在 RUN-2231 排队执行。</div></div>
        ${S.fabAsked?`<div class="bub fade"><div class="bav">${I('bot',12)}</div><div class="bt">你名下待审批 2 项:<br>① 我申请执行 rm -rf .cache/fixtures(越权)<br>② Agent-012 的 Release v1.3 跨团队发布</div></div>`:''}
      </div>
      <div class="row g8" style="padding:0 12px 8px;flex-wrap:wrap">
        <button class="qchip">下达任务</button>
        <button class="qchip" data-a="fab-ask">查我的审批</button>
        <button class="qchip">整理今天纪要</button>
      </div>
      <div class="row" style="margin:4px 12px 12px;padding:8px 12px;border-radius:12px;background:var(--bg);color:var(--faint);font-size:12px">对 007 说点什么…<span class="ml num">⏎</span></div>
    </div>`;
  if (S.modal) h += `
    <div class="mask">
      <div class="card modal fade">
        <div class="mhead"><span style="color:var(--goldDeep)">${I('shieldA',16)}</span> 审批请求</div>
        <div style="padding:20px;display:flex;flex-direction:column;gap:14px">
          <div class="row g12">
            <div style="width:44px;height:44px;border-radius:50%;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center">${I('bot',20)}</div>
            <div>
              <div style="font-size:14px;font-weight:600">Agent-007 <span style="font-weight:400;font-size:12px;color:var(--sub)">· 代码评审员</span></div>
              <div style="font-size:12px;color:var(--sub);margin-top:2px">权限:只读仓库 / 发评论 / 跑测试</div>
            </div>
            <span class="ml">${pill('gold','编制 A-007')}</span>
          </div>
          <div style="font-size:14px;line-height:1.7">
            申请执行 <code class="codechip num">rm -rf .cache/fixtures</code>
            <div style="font-size:12px;color:var(--sub);margin-top:6px">该操作超出其岗位权限。批准与拒绝都会写入审计。</div>
          </div>
          <div class="row g8" style="padding-top:4px">
            <button class="gbtn" data-a="approve-yes">批准执行</button>
            <button class="soft" data-a="approve-no" style="font-size:14px;padding:10px 16px;color:var(--sub)">拒绝</button>
          </div>
        </div>
      </div>
    </div>`;
  return h;
}

/* ================= 渲染与事件 ================= */
function render(){
  document.getElementById('side').innerHTML = sideHTML();
  const main = document.getElementById('main');
  const notice = S.notice ? `<div class="noticeBar fade">${I('spark',13)} ${S.notice}<button class="ml" data-a="notice-x">${I('x',13)}</button></div>` : '';
  const body = S.view==='home' ? homeHTML() : S.view==='roster' ? rosterHTML() : S.view==='meeting' ? meetingHTML() : capsHTML();
  main.innerHTML = notice + body;
  document.getElementById('layer').innerHTML = layerHTML();
  syncMeetTimers();
}
function syncMeetTimers(){
  meetTimers.forEach(clearInterval); meetTimers = [];
  if (S.view!=='meeting') return;
  meetTimers.push(setInterval(()=>{
    S.sec++;
    const el = document.getElementById('mtimer');
    if (el) el.textContent = String(Math.floor(S.sec/60)).padStart(2,'0')+':'+String(S.sec%60).padStart(2,'0');
  },1000));
  meetTimers.push(setInterval(()=>{
    S.ci = (S.ci+1)%CAPTIONS.length;
    const el = document.getElementById('capline');
    if (el) el.innerHTML = capHTML();
  },3000));
}
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-a]'); if(!t) return;
  const a = t.dataset.a;
  if (a==='nav'){
    if (t.dataset.ok==='1'){ S.view = t.dataset.v; S.notice=''; }
    else S.notice = `「${t.dataset.l}」沿用暗色概念稿形态,本稿聚焦中控台 / 编制 / 会议 / 能力库`;
  }
  else if (a==='notice-x') S.notice='';
  else if (a==='filter') S.filter = t.dataset.f;
  else if (a==='approve-open') S.modal = true;
  else if (a==='approve-yes'){ S.modal=false; S.approved=true; }
  else if (a==='approve-no') S.modal=false;
  else if (a==='fab') S.fab = !S.fab;
  else if (a==='fab-ask') S.fabAsked = true;
  else if (a==='meet-ask') S.asked = true;
  else if (a==='meet-mic') S.mic = !S.mic;
  else if (a==='trace') S.trace = !S.trace;
  render();
});
render();
</script>
</body>
</html>
