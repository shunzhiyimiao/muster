            <span class="num" style="font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--indigo)">CAPSULE</span>
            <span class="tag">${c.team}</span>
            <span class="ml row g6">
              ${c.restricted?`<span class="tag red">${I('lock',10)} restricted</span>`:''}
              ${c.hot?`<span class="tag ind">高复用</span>`:''}
            </span>
          </div>
          <div style="margin-top:10px;font-size:15px"><b>${c.name}</b> <span class="num" style="font-size:11.5px;color:var(--sub)">${c.ver}</span></div>
          <div class="row g6" style="margin-top:8px;flex-wrap:wrap">${c.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
          <div class="row" style="gap:12px;margin-top:14px;font-size:11.5px">
            ${c.verifying
              ? `<span class="row g8" style="color:var(--amber)">验真中 ${c.rate}% <span style="width:64px;height:6px;border-radius:99px;background:var(--soft);overflow:hidden"><i style="display:block;height:100%;width:${c.rate}%;background:var(--amber)"></i></span></span>`
              : `<span class="row" style="gap:4px;font-weight:600;color:var(--green)">${I('badge',13)} 验真 ${c.rate}% · ${c.runs} 次影子重放</span>`}
            <span style="color:var(--sub)">使用 ${c.used} 次</span>
            <span class="tag">${c.scope}</span>
          </div>
          <div class="row g8" style="margin-top:16px">
            <button class="iBtn" style="padding:7px 13px">${I('play',12)} 运行</button>
            <button class="gBtn" ${c.hot?'data-a="trace"':''} style="padding:7px 13px">${I('branch',12)} 溯源</button>
          </div>
          ${S.trace&&c.hot?`
            <div class="trace fade">
              ${tstep('锻造自成功运行 RUN-1893','支付组 · 07-02 · 全事件链归档','faint',1,0)}
              ${tstep('参数化 3 项','目标仓库 / 发布分支 / 灰度比例','faint',0,0)}
              ${tstep('影子重放验真 32/33','环境夹具:仓库快照 + 依赖锁定','green',0,0)}
              ${tstep('Promote:支付组 → 跨团队','管理员批准 · 密级随包迁移','ind',0,1)}
            </div>`:''}
        </div>`).join('')}
    </div>
  </div>`;
}
const tstep=(t,d,tone,first,last)=>`
  <div class="tstep">
    <div class="rail">
      ${first?'':'<span class="vln" style="height:8px"></span>'}
      <span class="dot" style="background:${tone==='ind'?'var(--indigo)':tone==='green'?'var(--green)':'var(--faint)'}"></span>
      ${last?'':'<span class="vln" style="flex:1"></span>'}
    </div>
    <div class="body">
      <div style="font-weight:600;color:${tone==='ind'?'var(--indigo)':tone==='green'?'var(--green)':'var(--ink)'}">${t}</div>
      <div class="d num">${d}</div>
    </div>
  </div>`;

/* ================= 悬浮层 ================= */
function layerHTML(){
  let h=`<button class="fab" data-a="fab">${I('bot',24)}</button>`;
  if(S.fab) h+=`
    <div class="drawer fade">
      <div class="dhead">
        <div style="width:30px;height:30px;border-radius:10px;background:var(--indigo);color:#fff;display:flex;align-items:center;justify-content:center">${I('bot',15)}</div>
        <b style="font-size:13px">Agent-007</b><span class="tag ind" style="background:#fff">编制 A-007</span><span class="ml">${routeTag(true)}</span>
      </div>
      <div style="padding:12px;max-height:210px;overflow-y:auto">
        <div class="bub"><div class="bav">${I('bot',12)}</div><div class="bt">我在。周会纪要已发布到 #platform,回滚脚本草稿在 RUN-2231 排队执行。</div></div>
        ${S.fabAsked?`<div class="bub fade"><div class="bav">${I('bot',12)}</div><div class="bt">你名下待审批 2 项:<br>① 我申请执行 rm -rf .cache/fixtures(越权)<br>② Agent-012 的 Release v1.3 跨团队发布</div></div>`:''}
      </div>
      <div class="row g6" style="padding:0 12px 8px;flex-wrap:wrap">
        <button class="qchip">下达任务</button>
        <button class="qchip" data-a="fab-ask">查我的审批</button>
        <button class="qchip">整理今天纪要</button>
      </div>
      <div class="row" style="margin:4px 12px 12px;padding:8px 12px;border-radius:11px;background:var(--soft);color:var(--faint);font-size:12px">对 007 说点什么…<span class="ml">⏎</span></div>
    </div>`;
  if(S.modal) h+=`
    <div class="mask">
      <div class="modal fade">
        <div class="mhead">${I('shieldA',15)} 审批请求</div>
        <div style="padding:20px;display:flex;flex-direction:column;gap:14px">
          <div class="row g12">
            <div style="width:44px;height:44px;border-radius:14px;background:var(--indigoSoft);color:var(--indigo);display:flex;align-items:center;justify-content:center">${I('bot',20)}</div>
            <div>
              <div style="font-size:14px;font-weight:700">Agent-007 <span style="font-weight:400;font-size:11.5px;color:var(--sub)">· 代码评审员</span></div>
              <div style="font-size:11.5px;color:var(--sub);margin-top:2px">权限:只读仓库 / 发评论 / 跑测试</div>
            </div>
            <span class="ml tag ind">编制 A-007</span>
          </div>
          <div style="font-size:13.5px;line-height:1.7">
            申请执行 <code class="codechip num">rm -rf .cache/fixtures</code>
            <div style="font-size:11.5px;color:var(--sub);margin-top:6px">该操作超出其岗位权限。批准与拒绝都会写入审计。</div>
          </div>
          <div class="row g8" style="padding-top:2px">
            <button class="iBtn" data-a="approve-yes" style="padding:10px 18px">批准执行</button>
            <button class="gBtn" data-a="approve-no" style="padding:10px 18px;color:var(--sub)">拒绝</button>
          </div>
        </div>
      </div>
    </div>`;
  return h;
}

/* ================= 渲染与事件 ================= */
const TITLES = {
  home:['中控台','2026年7月22日 星期三 · 全组织实时态势'],
  roster:['编制管理','人与 Agent · 同一套编制、卡片与审计'],
  meeting:['会议室','平台组周会 · Agent-007 / 021 在席'],
  caps:['能力库','组织的 Capsule 资产池'],
};
function render(){
  document.getElementById('side').innerHTML = sideHTML();
  const main=document.getElementById('main');
  const [t,s]=TITLES[S.view];
  const notice=S.notice?`<div class="noticeBar fade">${I('spark',13)} ${S.notice}<button class="ml" data-a="notice-x">${I('x',13)}</button></div>`:'';
  const body=S.view==='home'?homeHTML():S.view==='roster'?rosterHTML():S.view==='meeting'?meetingHTML():capsHTML();
  main.innerHTML = topbar(t,s)+notice+body;
  document.getElementById('layer').innerHTML = layerHTML();
  syncMeetTimers();
}
function syncMeetTimers(){
  meetTimers.forEach(clearInterval); meetTimers=[];
  if(S.view!=='meeting') return;
  meetTimers.push(setInterval(()=>{S.sec++;
    const el=document.getElementById('mtimer');
    if(el) el.textContent=String(Math.floor(S.sec/60)).padStart(2,'0')+':'+String(S.sec%60).padStart(2,'0');
  },1000));
  meetTimers.push(setInterval(()=>{S.ci=(S.ci+1)%CAPTIONS.length;
    const el=document.getElementById('capline');
    if(el) el.innerHTML=capHTML();
  },3000));
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]'); if(!t) return;
  const a=t.dataset.a;
  if(a==='nav'){
    if(t.dataset.ok==='1'){S.view=t.dataset.v;S.notice='';}
    else S.notice=`「${t.dataset.l}」沿用前稿形态,本稿聚焦中控台 / 编制 / 会议 / 能力库`;
  }
  else if(a==='notice-x') S.notice='';
  else if(a==='filter') S.filter=t.dataset.f;
  else if(a==='approve-open') S.modal=true;
  else if(a==='approve-yes'){S.modal=false;S.approved=true;}
  else if(a==='approve-no') S.modal=false;
  else if(a==='fab') S.fab=!S.fab;
  else if(a==='fab-ask') S.fabAsked=true;
  else if(a==='meet-ask') S.asked=true;
  else if(a==='meet-mic') S.mic=!S.mic;
  else if(a==='trace') S.trace=!S.trace;
  render();
});
render();
</script>
</body>
</html>
