<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>Muster · 概念稿 v4</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap');
  :root{
    --canvas:#E9EAF2; --shell:#FFFFFF; --panel:#F7F8FB; --railbg:#F1F2F7; --soft:#F1F2F7; --line:#ECEDF3;
    --ink:#17181C; --sub:#8B8FA3; --faint:#B9BCCB;
    --indigo:#5B5BF5; --indigoDeep:#4747E0; --indigoSoft:#EEEEFE;
    --green:#16A34A; --greenSoft:#E4F6EC; --red:#E5484D; --redSoft:#FDE9E9;
    --amber:#D97706; --amberSoft:#FCF1DF; --teal:#0EA5A5; --tealSoft:#E2F5F5;
    --barGray:#E3E4EC; --black:#17181C;
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter','Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif}
  html,body{height:100%}
  body{background:var(--canvas);color:var(--ink);overflow:hidden}
  button{border:none;background:none;cursor:pointer;color:inherit;font:inherit}
  button:disabled{cursor:not-allowed}
  button:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
  ::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#D6D8E3;border-radius:4px}
  svg{display:inline-block;vertical-align:middle;flex:none}

  .shell{position:absolute;inset:14px;background:var(--shell);border-radius:26px;display:flex;overflow:hidden;box-shadow:0 12px 40px rgba(23,24,28,.08)}
  .main{flex:1;min-width:0;overflow-y:auto}

  /* 图标轨 */
  .rail{width:56px;flex:none;display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:6px;background:var(--railbg);border-right:1px solid var(--line)}
  .logo{width:36px;height:36px;border-radius:12px;background:var(--indigo);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;margin-bottom:8px}
  .railBtn{position:relative;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#8B8FA3}
  .railBtn.on{background:var(--indigo);color:#fff;box-shadow:0 6px 14px rgba(91,91,245,.28)}
  .railMe{margin-top:auto;width:36px;height:36px;border-radius:50%;background:var(--indigoSoft);color:var(--indigo);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
  .rdot{position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--red)}

  /* 二级栏 */
  .side{width:224px;flex:none;display:flex;flex-direction:column;padding:16px 12px;overflow-y:auto;background:var(--panel);border-right:1px solid var(--line)}
  .sideTitle{padding:0 8px 8px;font-size:13px;font-weight:700}
  .navSec{margin:16px 8px 6px;font-size:10px;font-weight:600;letter-spacing:.12em;color:var(--faint);display:flex;align-items:center}
  .nav{width:100%;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:11px;font-size:13px;color:#5A5E70;text-align:left;font-weight:500;position:relative}
  .nav.on{background:var(--indigo);color:#fff;font-weight:600;box-shadow:0 6px 14px rgba(91,91,245,.28)}
  .subnav{margin-left:14px;padding-left:8px;border-left:1px solid var(--line)}
  .chan{width:100%;display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:9px;font-size:12.5px;color:#5A5E70;text-align:left}
  .chan.on{background:var(--indigo);color:#fff;font-weight:600}
  .teamHead{width:100%;display:flex;align-items:center;gap:8px;padding:8px;border-radius:11px;text-align:left}
  .tbadge{width:24px;height:24px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;background:#E4E6EF;color:#5A5E70}
  .tbadge.on{background:var(--indigo);color:#fff}
  .newTag{font-size:9px;font-weight:700;padding:2px 6px;border-radius:6px;background:var(--indigoSoft);color:var(--indigo);margin-left:auto}
  .nav.on .newTag{background:rgba(255,255,255,.22);color:#fff}
  .drillCard{margin-top:auto;background:var(--black);border-radius:16px;padding:14px;color:#fff}
  .drillCard .ic{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;margin-bottom:8px}
  .drillCard b{font-size:13px}
  .drillCard p{font-size:10.5px;color:#9FA3B5;margin-top:4px;line-height:1.5}
  .drillBtn{margin-top:10px;width:100%;padding:8px 0;border-radius:10px;background:var(--indigo);color:#fff;font-size:11.5px;font-weight:600}
  .streamCard{margin-top:auto;border-radius:14px;padding:12px;border:1px solid var(--line);background:#fff}
  .streamCard.live{background:var(--indigo);border-color:var(--indigo);color:#fff}

  /* 顶栏与通用 */
  .topbar{display:flex;align-items:center;padding:20px 28px 6px}
  .pgTitle{font-size:21px;font-weight:700;letter-spacing:-.01em}
  .pgSub{font-size:12px;color:var(--sub);margin-top:3px}
  .modChip{font-size:10px;font-weight:600;padding:3px 8px;border-radius:7px;margin-left:8px}
  .circBtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:#5A5E70}
  .row{display:flex;align-items:center}.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}.ml{margin-left:auto}
  .card{background:var(--shell);border:1px solid var(--line);border-radius:18px}
  .pct{display:inline-flex;font-size:10.5px;font-weight:600;padding:3px 7px;border-radius:999px}
  .pct.up{background:var(--greenSoft);color:var(--green)}.pct.dn{background:var(--redSoft);color:var(--red)}
  .tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;padding:3px 8px;border-radius:8px;background:var(--soft);color:var(--sub)}
  .tag.ind{background:var(--indigoSoft);color:var(--indigo)}.tag.red{background:var(--redSoft);color:var(--red)}
  .tag.grn{background:var(--greenSoft);color:var(--green)}.tag.amb{background:var(--amberSoft);color:var(--amber)}
  .tag.teal{background:var(--tealSoft);color:var(--teal)}
  .rt{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:999px}
  .chipDd{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#5A5E70;border:1px solid var(--line);border-radius:999px;padding:5px 10px}
  .iBtn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:8px 14px;border-radius:11px;background:var(--indigo);color:#fff}
  .gBtn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:8px 14px;border-radius:11px;background:var(--soft);color:var(--ink)}
  .page{padding:8px 28px 32px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
  .noticeBar{margin:8px 28px 0;padding:9px 14px;border-radius:12px;font-size:12px;display:flex;align-items:center;gap:8px;background:var(--indigoSoft);color:var(--indigoDeep)}
  .fade{animation:fadeUp .3s ease-out both}
  @keyframes fadeUp{0%{opacity:0;transform:translateY(4px)}100%{opacity:1;transform:none}}
  @keyframes wave{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
  .wvbar{display:inline-block;width:4px;border-radius:99px;background:var(--indigo);animation:wave 1.1s ease-in-out infinite;transform-origin:center}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}
  .lvdot{display:inline-block;border-radius:50%;animation:pulse 1.4s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){.wvbar,.fade,.lvdot{animation:none!important}}

  /* KPI / 图表 / 列表(中控台) */
  .kpi{border:1px solid var(--line);border-radius:18px;padding:16px;background:var(--shell)}
  .kpi .ic{width:36px;height:36px;border-radius:11px;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--ink)}
  .kpi .lbl{font-size:12px;color:var(--sub);margin-top:14px}
  .kpi .val{font-size:26px;font-weight:800;margin-top:2px;letter-spacing:-.02em}
  .kpi .cap{font-size:10.5px;color:var(--faint);margin-top:2px}
  .kpi.hero{background:var(--indigo);border-color:var(--indigo);color:#fff;box-shadow:0 10px 24px rgba(91,91,245,.3)}
  .kpi.hero .ic{background:#fff;color:var(--indigo)}
  .kpi.hero .lbl{color:#DCDCFE}.kpi.hero .cap{color:#BDBDF9}
  .pctHero{display:inline-flex;font-size:10.5px;font-weight:600;padding:3px 7px;border-radius:999px;background:rgba(255,255,255,.2);color:#fff}
  .bgrp{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:5px;position:relative}
  .bar{width:13px;border-radius:7px 7px 4px 4px}
  .bx{font-size:10.5px;color:var(--faint);text-align:center;margin-top:8px}
  .tip{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);background:var(--black);color:#fff;border-radius:12px;padding:9px 12px;font-size:11px;white-space:nowrap;box-shadow:0 8px 20px rgba(23,24,28,.25)}
  .tip:after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--black)}
  .tip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}
  .legRow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:12.5px}
  .legRow .li{width:28px;height:28px;border-radius:9px;background:var(--soft);display:flex;align-items:center;justify-content:center;color:#5A5E70}
  .aprow{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
  .aprow .av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
  .apBtn{font-size:11px;font-weight:600;padding:7px 12px;border-radius:999px;background:var(--indigo);color:#fff}
  .todo{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
  .todo .bar4{width:4px;height:34px;border-radius:99px;flex:none}
  .todo .arr{margin-left:auto;width:28px;height:28px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:none;color:#5A5E70}

  /* 编制卡 */
  .fpill{font-size:12px;padding:8px 14px;border-radius:11px;font-weight:500;background:var(--soft);color:var(--sub)}
  .fpill.on{background:var(--indigo);color:#fff;font-weight:600}
  .searchBox{display:flex;align-items:center;gap:8px;flex:1;max-width:340px;padding:9px 14px;border-radius:11px;font-size:13px;background:var(--soft);color:var(--faint)}
  .pcard{border:1px solid var(--line);border-radius:18px;background:var(--shell);padding:18px;display:flex;flex-direction:column}
  .pcard.feat{background:var(--indigo);border-color:var(--indigo);color:#fff;box-shadow:0 10px 24px rgba(91,91,245,.3)}
  .pav{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px}
  .ptile{border-radius:12px;padding:10px 4px;text-align:center;background:var(--soft)}
  .pcard.feat .ptile{background:rgba(255,255,255,.13)}
  .ptile .l{font-size:10px;color:var(--sub);margin-top:4px}
  .pcard.feat .ptile .l{color:#C9C9FB}
  .ptile .v{font-size:11.5px;font-weight:700;margin-top:2px}
  .ghostBtn{font-size:11.5px;font-weight:600;padding:6px 12px;border-radius:10px;background:var(--indigoSoft);color:var(--indigo)}
  .pcard.feat .ghostBtn{background:#fff;color:var(--indigo)}

  /* 频道 */
  .chanWrap{padding:4px 28px 24px;display:flex;gap:16px;height:calc(100% - 70px)}
  .msgAv{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
  .shareCard{margin-left:42px;max-width:600px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
  .cbAv{width:26px;height:26px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none}
  .cbTxt{border-radius:12px;padding:8px 11px;line-height:1.6;background:var(--soft);color:#454A5C;font-size:12px}
  .pin{border-radius:12px;padding:11px;border:1px solid var(--line);background:var(--panel);margin-bottom:8px}

  /* 会议 */
  .meetWrap{padding:4px 28px 24px;height:calc(100% - 70px);display:flex;gap:16px}
  .seats{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1;min-height:0}
  .seat{position:relative;display:flex;align-items:center;justify-content:center;background:var(--panel);border:2px solid transparent;border-radius:18px}
  .seat.spk{border-color:var(--indigo)}
  .seat .sav{width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:700}
  .seat .snm{position:absolute;left:12px;bottom:10px;font-size:13px;font-weight:600}
  .ctl{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--soft);color:var(--ink)}
  .ctl.off{background:var(--redSoft);color:var(--red)}
  .notes{width:300px;flex:none;display:flex;flex-direction:column;overflow:hidden}
  .nitem{border-top:1px solid var(--line);padding:10px 0;font-size:12px}
  .nitem .nt{margin-top:5px;line-height:1.6;color:#454A5C}

  /* 档案页 */
  .tiltCard{transform:rotate(-3deg);position:relative;flex:none}
  .tiltInner{width:126px;height:142px;border-radius:18px;background:var(--indigoSoft);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(23,24,28,.12);color:var(--indigo)}
  .idTag{position:absolute;left:8px;bottom:8px;font-size:10px;font-weight:600;padding:2px 6px;border-radius:5px;background:#fff;color:var(--sub)}
  .seal{position:absolute;right:-12px;bottom:-12px;width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--indigo)}
  .heatCell{width:9px;height:9px;border-radius:2px;display:inline-block}
  .trace{margin-top:14px;border-radius:12px;padding:14px;background:var(--panel);font-size:12px}
  .tstep{display:flex;gap:11px}
  .tstep .rail2{display:flex;flex-direction:column;align-items:center}
  .tstep .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .tstep .vln{width:1px;background:var(--line)}
  .tstep .body{padding-bottom:11px}
  .tstep .d{font-size:10px;color:var(--faint);margin-top:2px}

  /* FAB / 弹窗 */
  .fab{position:fixed;bottom:30px;right:30px;width:54px;height:54px;border-radius:18px;background:var(--indigo);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(91,91,245,.4);z-index:40;color:#fff}
  .drawer{position:fixed;bottom:96px;right:30px;width:310px;z-index:40;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 16px 40px rgba(23,24,28,.14)}
  .dhead{padding:12px 14px;display:flex;align-items:center;gap:9px;background:var(--indigoSoft)}
  .bub{display:flex;gap:8px;margin-bottom:8px;font-size:12px}
  .bub .bav{width:24px;height:24px;border-radius:8px;background:var(--indigo);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
  .bub .bt{background:var(--soft);border-radius:12px;padding:8px 11px;line-height:1.6}
  .qchip{font-size:11px;padding:5px 10px;border-radius:9px;background:var(--soft)}
  .mask{position:fixed;inset:0;background:rgba(23,24,28,.35);display:flex;align-items:center;justify-content:center;z-index:50}
  .modal{overflow:hidden;background:#fff;border-radius:20px;box-shadow:0 24px 60px rgba(23,24,28,.25)}
  .mhead{padding:14px 20px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;background:var(--indigoSoft);color:var(--indigoDeep)}
  .codechip{font-size:11.5px;padding:4px 8px;border-radius:8px;background:var(--redSoft);color:var(--red)}
  .mark{position:fixed;left:22px;bottom:20px;font-size:10px;color:#A6AABB;z-index:30}
</style>
</head>
<body>
<div class="shell">
  <div class="rail" id="rail"></div>
  <aside class="side" id="side"></aside>
  <main class="main" id="main"></main>
</div>
<div id="layer"></div>
<div class="mark">Muster · 概念稿 v4(个人/团队双模块)· 数据为演示脚本</div>

<script>
/* ================= 图标 ================= */
const P = {

  radio:'<circle cx="12" cy="12" r="2"/><path d="M7.8 16.2a6 6 0 0 1 0-8.4M16.2 7.8a6 6 0 0 1 0 8.4"/>',
  spark:'<path d="M12 4l1.6 4.4L18 10l-4.4 1.6L12 16l-1.6-4.4L6 10l4.4-1.6z"/><path d="M18.6 15.6l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/>',
  badge:'<circle cx="12" cy="12" r="8"/><path d="M8.5 12.2l2.3 2.3 4.7-5"/>',
  play:'<path d="M8 5.5v13l10-6.5z"/>',
  branch:'<circle cx="6.5" cy="6" r="2.2"/><circle cx="6.5" cy="18" r="2.2"/><circle cx="17.5" cy="8" r="2.2"/><path d="M6.5 8.2v7.6"/><path d="M17.5 10.2c0 4-6 3.2-9 5.2"/>',

    + '<div style="font-size:11px;margin:14px 0 8px;color:var(--sub)">选择目标频道 · 密级跟着会话走</div>'
    + [
        {t:'平台组',c:'platform',lv:'internal',ok:1},
        {t:'平台组',c:'code-review',lv:'internal',ok:1},
        {t:'平台组',c:'general',lv:'open',ok:0},
        {t:'支付组',c:'payments',lv:'internal',ok:1},
      ].map(o=>'<button class="row" style="width:100%;gap:8px;padding:10px 12px;border-radius:12px;text-align:left;font-size:13px;margin-bottom:6px;'
        + 'background:'+(o.ok?'var(--soft)':'#FBFBFD')+';color:'+(o.ok?'var(--ink)':'var(--faint)')+'" '
        + (o.ok?'data-a="stream-go"':'disabled')+'>'
        + I('hash',13)+' '+o.c+'<span style="font-size:10.5px;color:var(--faint)">· '+o.t+'</span>'
        + '<span class="ml row g6">'+tag(o.lv==='open'?'':'amb',o.lv)
        + (o.ok?'':'<span class="row" style="gap:4px;font-size:10px;color:var(--red)">'+I('lock',10)+'低于会话密级</span>')+'</span></button>').join('')
    + '<div style="font-size:10.5px;margin-top:10px;line-height:1.7;color:var(--faint)">串流为只读投屏:队友可围观与提问,接手需你授权。全程计入审计,本地会话外发仍为 0 B。</div>'
    + '</div></div></div>';

  if (S.modal) h += '<div class="mask"><div class="modal fade" style="width:392px"><div class="mhead">'+I('shieldA',15)+' 审批请求</div>'
    + '<div style="padding:20px;display:flex;flex-direction:column;gap:14px">'
    + '<div class="row g12"><div style="width:44px;height:44px;border-radius:14px;background:var(--indigoSoft);color:var(--indigo);display:flex;align-items:center;justify-content:center">'+I('bot',20)+'</div>'
    + '<div><div style="font-size:14px;font-weight:700">Agent-007 <span style="font-weight:400;font-size:11.5px;color:var(--sub)">· 代码评审员</span></div>'
    + '<div style="font-size:11.5px;color:var(--sub);margin-top:2px">权限:只读仓库 / 发评论 / 跑测试</div></div>'
    + '<span class="ml tag ind">编制 A-007</span></div>'
    + '<div style="font-size:13.5px;line-height:1.7">申请执行 <code class="codechip">rm -rf .cache/fixtures</code>'
    + '<div style="font-size:11.5px;color:var(--sub);margin-top:6px">该操作超出其岗位权限。批准与拒绝都会写入审计。</div></div>'
    + '<div class="row g8" style="padding-top:2px"><button class="iBtn" data-a="approve-yes" style="padding:10px 18px">批准执行</button>'
    + '<button class="gBtn" data-a="approve-no" style="padding:10px 18px;color:var(--sub)">拒绝</button></div></div></div></div>';

  if (S.convo!=='closed') h += '<div class="mask"><div class="modal fade" style="width:480px;max-height:80vh;display:flex;flex-direction:column">'
    + '<div class="row g8" style="padding:12px 16px;border-bottom:1px solid var(--line)">'+I('share2',14)+'<b style="font-size:14px">对话快照 · 支付重试幂等性讨论</b>'
    + '<button class="ml" data-a="convo-x" style="color:var(--sub)">'+I('x',15)+'</button></div>'
    + '<div class="row" style="gap:8px;padding:8px 16px;border-bottom:1px solid var(--line);font-size:10.5px;color:var(--sub);flex-wrap:wrap">Alice ↔ 小七(A-007) · 14 条 · 07-21 · '+routeTag(1)+' qwen3:8b · 外发 0 B · '+tag('amb','internal')+'</div>'
    + '<div style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;font-size:12.5px">'
    + cb('Alice',0,'支付重试如果网络抖动重复提交,现在的幂等保障够吗?')
    + cb('小七',1,'查了 gateway/retry.rs:幂等键由业务侧各自拼接,三处实现不一致,存在重复扣款窗口。建议网关层统一生成,业务侧只透传。')
    + cb('Alice',0,'迁移成本呢?')
    + cb('小七',1,'两个服务需要改造,预计各 0.5 天;我可以先产出兼容层 diff,灰度期双写。')
    + '<div style="text-align:center;font-size:10px;color:var(--faint)">—— 其余 10 条已折叠 ——</div></div>'
    + (S.convo==='blocked'?'<div class="fade" style="margin:0 16px 12px;padding:12px;border-radius:12px;font-size:12px;background:var(--redSoft)">'
      + '<div class="row" style="gap:6px;font-weight:600;color:var(--red)">'+I('shieldA',13)+' 分享被策略阻止</div>'
      + '<div style="margin-top:4px;line-height:1.7;color:#8A4A4D">该对话密级为 <b>internal</b>,目标频道 <b>#general</b> 为 open。<b>密级跟着对话走</b>:向低密级频道分享需发起降密审批(v1.1),或改分享到同级频道。</div></div>':'')
    + '<div class="row g8" style="padding:12px 16px;border-top:1px solid var(--line)">'
    + '<button class="ghostBtn">引用到 #platform</button>'
    + '<button class="gBtn" data-a="convo-block" style="color:var(--sub)">分享到 #general(open)</button>'
    + '<span class="ml" style="font-size:10px;color:var(--faint)">快照只读 · 引用可溯源</span></div></div></div>';

  if (S.notice) { /* handled in main */ }
  return h;
}

/* ================= 渲染与事件 ================= */
function render(){
  document.getElementById('rail').innerHTML = railHTML();
  document.getElementById('side').innerHTML = sideHTML();
  const bodies = { home:homeHTML, phome:phomeHTML, agent:agentHTML, channel:channelHTML, roster:rosterHTML, meeting:meetingHTML, caps:capsHTML };
  const notice = S.notice ? '<div class="noticeBar fade">'+I('spark',13)+' '+S.notice+'<button class="ml" data-a="notice-x">'+I('x',13)+'</button></div>' : '';
  document.getElementById('main').innerHTML = topbarHTML() + notice + bodies[S.view]();
  document.getElementById('layer').innerHTML = layerHTML();
  syncMeetTimers();
}
function syncMeetTimers(){
  meetTimers.forEach(clearInterval); meetTimers = [];
  if (S.view!=='meeting') return;
  meetTimers.push(setInterval(()=>{ S.sec++;
    const el=document.getElementById('mtimer');
    if(el) el.textContent=String(Math.floor(S.sec/60)).padStart(2,'0')+':'+String(S.sec%60).padStart(2,'0');
  },1000));
  meetTimers.push(setInterval(()=>{ S.ci=(S.ci+1)%CAPTIONS.length;
    const el=document.getElementById('capline');
    if(el) el.innerHTML=capHTML();
  },3000));
}
document.addEventListener('click', e=>{
  const t=e.target.closest('[data-a]'); if(!t) return;
  const a=t.dataset.a;
  if(a==='rail'){
    if(t.dataset.ok==='1'){ S.module=t.dataset.id; S.notice='';
      S.view = S.module==='console'?'home' : S.module==='personal'?'phome' : 'channel'; }
    else S.notice='「'+t.dataset.l+'」为完整形态占位模块,本稿聚焦控制台 / 个人工作台 / 团队';
  }
  else if(a==='view'){ S.view=t.dataset.v; S.notice='';
    if(['channel','roster','meeting','caps'].includes(S.view)) S.module='team';
    if(['phome','agent'].includes(S.view)) S.module='personal';
    if(S.view==='home') S.module='console'; }
  else if(a==='soft') S.notice='「'+t.dataset.l+'」为完整形态占位模块,本稿聚焦控制台 / 个人工作台 / 团队';
  else if(a==='team-toggle'){ const id=t.dataset.t; S.expanded[id]=!S.expanded[id]; }
  else if(a==='chan'){ S.module='team'; S.team=t.dataset.t; S.channel=t.dataset.c; S.view='channel'; S.notice=''; S.expanded[S.team]=true; }
  else if(a==='roster'){ S.module='team'; S.team=t.dataset.t; S.view='roster'; S.filter='全部'; S.notice=''; S.expanded[S.team]=true; }
  else if(a==='agent-sec') S.agentOpen=!S.agentOpen;
  else if(a==='go-platform'){ S.module='team'; S.team='platform'; S.channel='platform'; S.view='channel'; S.expanded.platform=true; }
  else if(a==='notice-x') S.notice='';
  else if(a==='filter') S.filter=t.dataset.f;
  else if(a==='approve-open') S.modal=true;
  else if(a==='approve-yes'){ S.modal=false; S.approved=true; }
  else if(a==='approve-no') S.modal=false;
  else if(a==='fab') S.fab=!S.fab;
  else if(a==='fab-ask') S.fabAsked=true;
  else if(a==='fab-cast'){ S.fab=false; S.picker=true; }
  else if(a==='fab-noop') return;
  else if(a==='stream-pick') S.picker=true;
  else if(a==='picker-x') S.picker=false;
  else if(a==='stream-go'){ S.streamed=true; S.picker=false; S.notice='已开始串流到 #platform · 团队成员可实时围观 · 遵循频道密级'; }
  else if(a==='stream-stop') S.streamed=false;
  else if(a==='meet-ask') S.asked=true;
  else if(a==='meet-mic') S.mic=!S.mic;
  else if(a==='trace') S.trace=!S.trace;
  else if(a==='intro') S.introduced=true;
  else if(a==='convo-open') S.convo='open';
  else if(a==='convo-block') S.convo='blocked';
  else if(a==='convo-x') S.convo='closed';
  render();
});
render();
</script>
</body>
</html>
