# 一条命令拉起服务端依赖。全部可自托管——主权前提不靠承诺,靠部署形态。
#   cd deploy && docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: muster
      POSTGRES_PASSWORD: muster
      POSTGRES_DB: muster
    # 映射到 5433 而不是 5432:开发机上常已装有本地 Postgres,
    # 它会占住 127.0.0.1:5432 并盖过 Docker 的映射,于是连上的是**另一个库**,
    # 报错还是"role 不存在"这种看不出根因的话。换个端口,不动用户已有的服务。
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muster"]
      interval: 5s
      retries: 10

  # 媒体面:Apache-2.0,自托管。Muster 不自建 SFU——回声消除、抖动缓冲、
  # NAT 穿透是一门专业手艺,做完也只是追平一个已被解决透的问题。
  livekit:
    image: livekit/livekit-server:latest
    # 不用 --dev:它内置的密钥是 6 个字符的 "secret",而 muster-server 要求
    # LIVEKIT_API_SECRET ≥32 字符(房间准入全靠这把钥匙)。这里显式给一把,
    # **内网部署务必换掉**——这一把是公开在仓库里的。
    command: --bind 0.0.0.0
    environment:
      LIVEKIT_KEYS: "devkey: devsecret_0123456789abcdef0123456789abcdef"
    ports:
      - "7880:7880"    # WebSocket 信令
      - "7881:7881"    # TCP 回退
      - "7882:7882/udp" # WebRTC 媒体

  # 转写:**必须是本地的**。会议音频是全系统密级最高的数据流,
  # 走云端 STT 会让演习报告说「零外发」而整场会议音频都出去了。
  # 它对 Muster 就是一个 Locality::Local 的 OpenAI 兼容 provider。
  # 换成任何暴露 OpenAI 兼容 /v1/audio/transcriptions 的镜像都行——
  # Muster 只认那个接口契约。下面这个镜像的接口路径请以其文档为准,
  # 对不上就换镜像或加一层适配,**不要改成调云端 API**。
  whisper:
    image: fedirz/faster-whisper-server:latest-cpu
    environment:
      WHISPER__MODEL: Systran/faster-whisper-base
    ports: ["9000:8000"]

volumes:
  pgdata:
