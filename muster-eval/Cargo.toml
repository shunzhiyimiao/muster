[package]
name = "muster-eval"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Muster A7 — 工具调用评测集：20 个固定样本，双 provider 成功率报告（G0′ 闸门证据）"

[dependencies]
muster-provider = { path = "../muster-provider" }
muster-prompt = { path = "../muster-prompt" }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "time"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
