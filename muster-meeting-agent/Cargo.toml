[package]
name = "muster-meeting-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
muster-provider = { path = "../muster-provider" }
muster-route = { path = "../muster-route" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
async-trait = "0.1"

# LiveKit 适配层**默认不编**。它传递依赖原生 WebRTC(构建期从 GitHub 拉
# 100MB+,target 1GB+,见 docs/A1-livekit-探针结论.md),而本仓的约定是
# "动手前后都跑 cargo test"——不能让每次跑测试都背上它。
#
# 核心链路(缓冲 → 切句 → 转写 → 回传)不依赖 SDK,在默认 feature 下全可测;
# LiveKit 只是帧的一个来源,测试是另一个。
# 必须走 git + 固定 commit:crates.io 上**没有任何一组 livekit 版本能编过**
# (0.8.1 的 data-stream 引用 livekit-common 里不存在的符号;0.7.53 的 api 与
# protocol 类型漂移;钉旧 protocol 也不行——下限就是漂移那批)。
# 详见 docs/A1-livekit-探针结论.md。**不要改成跟 main**:上游随时会再次失配。
livekit = { git = "https://github.com/livekit/rust-sdks", rev = "00258d1e52e563327f3ed75807ea03a189a5c2d2", default-features = false, features = ["tokio", "native-tls"], optional = true }
futures = { version = "0.3", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[features]
default = []
livekit = ["dep:livekit", "dep:futures"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 这两个 example 依赖 livekit,必须声明 required-features——否则
# `cargo test --workspace` 会去编它们,当场因为找不到 livekit 而失败,
# 把"默认构建不碰原生 WebRTC"这条前提废掉。(踩过一次,见 A4 文档。)
[[example]]
name = "agent"
required-features = ["livekit"]

[[example]]
name = "speak_wav"
required-features = ["livekit"]
