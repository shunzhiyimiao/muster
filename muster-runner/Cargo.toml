[package]
name = "muster-runner"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.85"
description = "Muster B1 — 任务执行器:路由 → 流式工具循环 → 审计事件链(Capsule-ready run)"

[dependencies]
muster-provider = { path = "../muster-provider" }
muster-prompt = { path = "../muster-prompt" }
muster-identity = { path = "../muster-identity" }
muster-route = { path = "../muster-route" }
muster-audit = { path = "../muster-audit" }
muster-skill = { path = "../muster-skill" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
thiserror = "1"
# 限流退避要睡一会儿;Runner 本身跑在调用方的 tokio 运行时上。
# 出网闸(egress)自带线程与 current_thread 运行时,需要 rt / net / io-util / sync / macros
tokio = { version = "1.38", features = ["time", "rt", "net", "io-util", "sync", "macros"] }

[dev-dependencies]
muster-identity = { path = "../muster-identity" }
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "time", "test-util"] }
tempfile = "3"
sha2 = "0.10"
