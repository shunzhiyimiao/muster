[package]
name = "muster-runner"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Muster B1 — 任务执行器:路由 → 流式工具循环 → 审计事件链(Capsule-ready run)"

[dependencies]
muster-provider = { path = "../muster-provider" }
muster-prompt = { path = "../muster-prompt" }
muster-route = { path = "../muster-route" }
muster-audit = { path = "../muster-audit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
thiserror = "1"

[dev-dependencies]
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "time"] }
tempfile = "3"
