[package]
name = "muster-server"
version = "0.1.0"
edition = "2021"

[dependencies]
muster-identity = { path = "../muster-identity" }
muster-audit = { path = "../muster-audit" }
muster-route = { path = "../muster-route" }
muster-provider = { path = "../muster-provider" }

axum = { version = "0.7", features = ["ws", "macros"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
tokio = { version = "1", features = ["full"] }
# default-features = false 是必须的:sqlx 的默认 feature 含 "any",会把 sqlite
# 驱动一并拉进来,与 muster-audit 的 rusqlite 抢同一个 links="sqlite3" 原生库。
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio", "tls-rustls", "postgres", "uuid", "json", "migrate", "macros",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
jsonwebtoken = "9"
argon2 = "0.5"
uuid = { version = "1", features = ["v4", "serde"] }
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros"] }
