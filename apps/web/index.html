<style>
  :root { --ink:#17181c; --sub:#5A5E70; --faint:#9095A6; --line:#E7E8EF;
          --panel:#F6F7FB; --indigo:#5B5BF5; --green:#12A150; --red:#E5484D; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
         color:var(--ink); background:#F1F2F7; }
  .wrap { max-width:1080px; margin:0 auto; padding:24px 20px 40px; }
  h1 { font-size:17px; margin:0 0 4px; }
  .dim { color:var(--faint); font-size:12px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:20px; margin-bottom:16px; }
  input,select,button { font:inherit; }
  input,select { width:100%; padding:9px 12px; border:1px solid var(--line);
                 border-radius:10px; background:var(--panel); outline:none; }
  label { display:block; margin-bottom:10px; }
  label span { font-size:12px; color:var(--faint); }
  button { padding:9px 16px; border:0; border-radius:10px; background:var(--panel);
           color:var(--sub); font-weight:600; cursor:pointer; }
  button.primary { background:var(--indigo); color:#fff; }
  button.danger { background:#FEEBEC; color:var(--red); }
  button.active { background:var(--indigo); color:#fff; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .row { display:flex; align-items:center; gap:10px; width:100%; text-align:left;
         padding:10px 0; border-top:1px solid var(--line); background:none; border-radius:0; }
  .tag { font-size:11px; padding:2px 8px; border-radius:8px; background:var(--panel); color:var(--sub); }
  .tag.internal { background:#FFF4E5; color:#B45309; }
  .tag.restricted { background:#FEEBEC; color:var(--red); }
  .badge { font-size:11px; font-weight:700; padding:3px 9px; border-radius:8px; }
  .badge.on { background:#E7F7EE; color:var(--green); }
  .badge.off { background:#FEEBEC; color:var(--red); }
  /* 待批任务。它是**提案**——所以按钮是"批准/驳回",不是"执行"。 */
  .task { border:1px solid var(--line); border-radius:12px; padding:10px 11px; margin-bottom:8px; }
  .task .t { font-size:12.5px; line-height:1.5; }
  .task .q { font-size:10.5px; color:var(--faint); margin-top:5px; line-height:1.45; }
  .task .acts { display:flex; gap:7px; margin-top:9px; align-items:center; }
  .task button { font-size:11px; padding:4px 11px; border-radius:8px; }
  .task .ok { background:var(--green); color:#fff; border-color:var(--green); }
  .task.done { opacity:.6; }
  .task .verdict { font-size:10.5px; font-weight:700; }
  .grid { display:grid; grid-template-columns:1.4fr 1fr; gap:16px; }
  @media (max-width:820px) { .grid { grid-template-columns:1fr; } }
  /* 参会者格子。发言时描边变绿——数据来自 LiveKit 的 ActiveSpeakersChanged,
     不是定时器也不是随机数:界面上的东西要么是真的,要么明说自己不是。 */
  #stage { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin-top:12px; }
  .seat { position:relative; border-radius:14px; overflow:hidden; background:var(--panel);
          border:2px solid transparent; transition:border-color .12s, box-shadow .12s; }
  .seat.speaking { border-color:var(--green); box-shadow:0 0 0 3px rgba(18,161,80,.14); }
  .seat .media { aspect-ratio:4/3; display:flex; align-items:center; justify-content:center; }
  .seat video { width:100%; height:100%; object-fit:cover; background:#000; display:block; }
  .initial { width:46px; height:46px; border-radius:50%; display:flex; align-items:center;
             justify-content:center; font-weight:700; font-size:18px; color:#fff; background:var(--indigo); }
  .seat .bar2 { display:flex; align-items:center; gap:6px; padding:6px 9px; background:#fff;
                border-top:1px solid var(--line); font-size:11.5px; }
  .seat .nm { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .seat .mic { margin-left:auto; font-size:10px; font-weight:700; padding:2px 6px; border-radius:6px;
               background:#E7F7EE; color:var(--green); }
  .seat .mic.off { background:var(--panel); color:var(--faint); }
  .seat .you { font-size:9.5px; color:var(--faint); font-weight:500; }
  #lines { max-height:440px; overflow-y:auto; }
  .line { padding:7px 0; border-top:1px solid var(--line); }
  .line b.sys { color:var(--red); }
  /* 字幕:纪要行叠在席位区底部,最近两句,10 秒淡出 */
  #stageWrap { position:relative; }
  .captions { position:absolute; left:8px; right:8px; bottom:8px; background:rgba(17,18,28,.78);
              color:#fff; padding:8px 14px; border-radius:12px; font-size:13px; line-height:1.4;
              pointer-events:none; backdrop-filter:blur(4px); }
  .captions b { color:#B9B9FF; margin-right:6px; }
  .line .tr { font-size:12px; color:var(--sub); margin-top:2px; }
  .badge.rec { background:#FEEBEC; color:var(--red); }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
           background:var(--ink); color:#fff; padding:10px 16px; border-radius:12px;
           font-size:12.5px; max-width:80vw; }
  .toast.bad { background:var(--red); }
  .bar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .note { font-size:11.5px; color:var(--sub); background:var(--panel);
          padding:10px 12px; border-radius:12px; margin-top:12px; line-height:1.7; }
</style>
</head>
<body>
<div class="wrap">

  <section id="login" class="card" hidden>
    <h1>Muster 智能协作平台 · 参会</h1>
    <div class="dim">用浏览器加入团队会议。开麦说话由会议 Agent 走本地转写,音频不出内网。</div>
    <form id="loginForm" style="margin-top:16px">
      <label><span>服务器地址</span><input id="server" /></label>
      <label><span>账号</span><input id="account" autocomplete="username" /></label>
      <label><span>口令</span><input id="password" type="password" autocomplete="current-password" /></label>
      <button class="primary" type="submit">连接</button>
    </form>
    <div class="note">
      这个页面只用来<b>参会</b>:发消息、开会、看纪要。<br />
      跑任务、审批、能力库需要本地 Runner 与本地审计链,浏览器里做不了——那些在桌面壳里。
    </div>
  </section>

  <section id="lobby" hidden>
    <div class="card">
      <div class="bar">
        <h1 style="flex:1">会议</h1>
        <span class="dim">已登录 <b id="who"></b></span>
      </div>
      <div class="bar" style="margin-top:14px">
        <select id="channel" style="max-width:260px"></select>
        <input id="title" placeholder="会议主题,例如「平台组周会」" style="flex:1;min-width:200px" />
        <button id="startMeeting" class="primary">发起会议</button>
        <button id="refresh">刷新</button>
      </div>
      <div class="note">会议密级继承所在频道——否则「把话题挪进会议」就成了绕过密级的办法。</div>
    </div>
    <div class="card">
      <b style="font-size:13px">进行中</b>
      <div id="meetings" style="margin-top:8px"></div>
    </div>
  </section>

  <section id="meeting" hidden>
    <div class="grid">
      <div>
        <div class="card">
          <div class="bar">
            <b id="mTitle" style="font-size:15px"></b>
            <span id="mLevel" class="tag"></span>
            <span id="recBadge" class="badge rec" hidden title="所有在场的人都看得见">● 正在录制</span>
            <span id="peers" class="dim" style="margin-left:auto"></span>
          </div>
          <div class="dim" id="mState" style="margin-top:4px">连接中…</div>
          <div id="stageWrap">
            <div id="stage"></div>
            <div id="captions" class="captions" hidden></div>
          </div>
          <div id="stageHint" class="dim" style="margin-top:8px;font-size:10.5px"></div>
          <!-- 音频元素必须在 DOM 里才会播,但它不属于任何一个可见格子 -->
          <div id="audioSink" hidden></div>
          <div class="bar" style="margin-top:14px">
            <button id="micBtn">开麦</button>
            <button id="agentBtn">请 Agent 来记录</button>
            <button id="capBtn" class="active" title="字幕 = 会议 Agent 的实时转写叠在画面上">字幕</button>
            <select id="capLang" style="width:auto" title="字幕语言。选了别的语言,会议 Agent 会把每句话翻过来(经密级路由)">
              <option value="source">跟原文(中文)</option>
              <option value="en">English</option>
              <option value="ja">日本語</option>
              <option value="ko">한국어</option>
              <option value="de">Deutsch</option>
              <option value="fr">Français</option>
              <option value="es">Español</option>
            </select>
            <button id="leaveBtn" class="danger" style="margin-left:auto">离开</button>
          </div>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:16px">
      <div class="card" id="tasksCard" hidden>
        <div class="bar">
          <b style="font-size:13px">待批任务</b>
          <span id="taskCount" class="badge off"></span>
          <span class="dim" style="margin-left:auto;font-size:10.5px">Agent 提案 · 需人确认</span>
        </div>
        <div id="tasks" style="margin-top:8px"></div>
      </div>

      <div class="card">
        <div class="bar">
          <b style="font-size:13px">实时纪要</b>
          <span id="agentState" class="badge off">Agent 不在会中</span>
          <span class="dim" style="margin-left:auto">本地转写</span>
        </div>
        <div id="lines" style="margin-top:8px"></div>
      </div>
      </div>
    </div>
  </section>

  <div id="toast" class="toast" hidden></div>
</div>
<script src="/app.js"></script>
</body>
</html>
