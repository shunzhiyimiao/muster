[package]
name = "muster-provider"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Muster A2 — pluggable ModelProvider abstraction: chat / streaming / tool calls / usage metering / locality-aware routing metadata"

[dependencies]
async-trait = "0.1"
bytes = "1"
futures = "0.3"
# Pinned: newer 0.12.x floats transitive MSRVs past our toolchain; unpin when the team
# standardizes on rustc >= 1.81.
reqwest = { version = "=0.12.5", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1.38", features = ["rt", "time", "macros"] }
toml = "0.8"
tracing = "0.1"
# Pinned: url >= 2.5.1 pulls the icu stack (rustc 1.81+). Unpin together with reqwest.
url = "=2.5.0"
# --- Version-steering pins -------------------------------------------------
# Direct pins exist only to steer resolution on this build container (cargo 1.75
# cannot parse edition-2024 manifests published in 2025+). They add NO features
# (default-features = false) so reqwest's own feature set stays authoritative.
# On a team toolchain with rustc >= 1.85, delete this whole block and unpin
# reqwest/url above.
zeroize = { version = "=1.7.0", default-features = false }
ring = { version = "=0.17.8", default-features = false }
rustls = { version = "=0.23.10", default-features = false }
rustls-pki-types = { version = "=1.7.0", default-features = false }
rustls-webpki = { version = "=0.102.4", default-features = false }
webpki-roots = "=0.26.3"
hyper = { version = "=1.3.1", default-features = false }
hyper-util = { version = "=0.1.5", default-features = false }
hyper-rustls = { version = "=0.27.2", default-features = false }
# reqwest's optional http3 stack still gets version-resolved into the lock;
# pin it to 2024-era releases for the same edition-2024 reason.
quinn = { version = "=0.11.2", default-features = false }
quinn-proto = { version = "=0.11.3", default-features = false }
quinn-udp = { version = "=0.5.2", default-features = false }
indexmap = { version = "=2.2.6", default-features = false }

[dev-dependencies]
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "time"] }
