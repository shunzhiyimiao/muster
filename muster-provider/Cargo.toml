[package]
name = "muster-provider"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.85"
description = "Muster A2 — pluggable ModelProvider abstraction: chat / streaming / tool calls / usage metering / locality-aware routing metadata"

[dependencies]
async-trait = "0.1"
bytes = "1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1.38", features = ["rt", "time", "macros"] }
# 流式转写(speech_stream):与 deploy/stt 的 sherpa-onnx 边车、以及日后的云端实时识别说 WebSocket。
# 钉 0.24 是因为 axum 已把它带进了 lock,不再多一份;rustls 走 reqwest 同一套。
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
toml = "0.8"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "time"] }
