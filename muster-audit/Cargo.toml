[package]
name = "muster-audit"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A9: append-only 审计事件层——产品的证据层,不是日志系统"

[dependencies]
muster-route = { path = "../muster-route" }
muster-provider = { path = "../muster-provider" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
