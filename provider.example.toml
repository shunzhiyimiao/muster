# Muster provider registry — example.
# 密钥永远不写在这里：api_key_env 填环境变量名，启动时解析，缺失即快速失败。

default = "deepseek"

[providers.deepseek]
kind = "openai_compat"
base_url = "https://api.deepseek.com/v1"
model = "deepseek-chat"
locality = "cloud"
display_name = "云端·DeepSeek"
api_key_env = "DEEPSEEK_API_KEY"

[providers.qwen]
kind = "openai_compat"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
model = "qwen-plus"
locality = "cloud"
display_name = "云端·Qwen"
api_key_env = "DASHSCOPE_API_KEY"

# Moonshot 开放平台端点(api.moonshot.cn;Kimi for Coding 套餐的 api.kimi.com/coding/v1
# 用的是另一种 key)。模型会先思考(响应含 reasoning_content,思考计入输出 token),故超时放宽。
[providers.kimi]
kind = "openai_compat"
base_url = "https://api.moonshot.cn/v1"
model = "kimi-k3"
locality = "cloud"
display_name = "云端·Kimi K3"
api_key_env = "KIMI_API_KEY"
timeout_secs = 300
# 探活(GET /models)单独计时,默认 20 秒;这个端点实测 3-12 秒才回
probe_timeout_secs = 30

# 本地保活通道（A5）：演示机上的 Ollama。restricted 仓库的任务只允许落在
# locality = "local" 的 provider 上 —— 这由 E2 路由强制，非约定。
[providers.local-ollama]
kind = "openai_compat"
base_url = "http://127.0.0.1:11434/v1"
model = "qwen3:8b"
locality = "local"
display_name = "本地·Ollama"
timeout_secs = 300
